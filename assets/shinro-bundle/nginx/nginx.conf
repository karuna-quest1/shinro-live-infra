# Server blocks live in conf.d/, written per stream by bin/render.py.
worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 50m;

  # Docker's DNS, re-resolved: proxy_pass uses variables so a restarted
  # container's new address is picked up instead of cached at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Room for long map keys: the origin-secret map holds a 48-character value.
  map_hash_bucket_size 128;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  log_format main escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
    '"upstream":"$upstream_addr","ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  include /etc/nginx/conf.d/*.conf;
}
